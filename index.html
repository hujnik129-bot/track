<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram NFT Gifts Tracker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #18222d);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #8ab4f8);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --card-bg: rgba(255, 255, 255, 0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        h2 {
            text-align: center;
            margin-bottom: 8px;
            font-size: 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 14px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 14px;
            color: var(--hint-color);
            font-weight: 500;
        }

        select, input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.2);
            color: var(--text-color);
            font-size: 14px;
            box-sizing: border-box;
        }

        .price-group {
            display: flex;
            gap: 10px;
        }

        .price-box {
            flex: 1;
        }

        button {
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: opacity 0.2s;
        }

        button:active {
            opacity: 0.8;
        }
    </style>
</head>

        <!-- Диапазон цен -->
        <div class="card">
            <label>Диапазон цены (TON):</label>
            <div class="price-group">
                <div class="price-box">
                    <input type="number" id="minPrice" placeholder="От" value="0">
                </div>
                <div class="price-box">
                    <input type="number" id="maxPrice" placeholder="До" value="50000">
                </div>
            </div>
        </div>

        <!-- Кнопка сохранения -->
        <button id="saveBtn">💾 Сохранить фильтры</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        document.getElementById('saveBtn').addEventListener('click', function() {
            let data = {
                min_price: document.getElementById('minPrice').value,
                max_price: document.getElementById('maxPrice').value,
                gift_type: document.getElementById('giftType').value,
                background: document.getElementById('background').value
            };

            tg.sendData(JSON.stringify(data));
            tg.close();
        });
    </script>
